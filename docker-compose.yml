version: "3.9"

services:

  # ── PostgreSQL + TimescaleDB ──────────────────────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solar_forecast}
      POSTGRES_USER: ${POSTGRES_USER:-solar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-solar} -d ${POSTGRES_DB:-solar_forecast}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Scraper + scheduler ───────────────────────────────────────────────────
  scheduler:
    build: .
    restart: unless-stopped
    command: python main.py scheduler
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solar}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-solar_forecast}
    volumes:
      - rawdata:/app/data/raw
      - models:/app/models
    depends_on:
      db:
        condition: service_healthy

  # ── Forecast REST API ─────────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    command: python main.py serve
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-solar}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-solar_forecast}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
    volumes:
      - models:/app/models
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health | grep -v unavailable"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
  rawdata:
  models:
